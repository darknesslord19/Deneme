name: APK Derle

on:
  push:
    branches: [video-editor]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: APK derle
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: APK'yı adlandır
        run: cp app/build/outputs/apk/release/app-release.apk KlipStudyo.apk

      - uses: actions/upload-artifact@v4
        with:
          name: KlipStudyo-apk
          path: KlipStudyo.apk

      - name: Release oluştur
        uses: softprops/action-gh-release@v2
        with:
          tag_name: klipstudyo-v1.${{ github.run_number }}
          name: Klip Stüdyo v1.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: false
          body: |
            Klip Stüdyo – fotoğraf ve videolardan efektli, geçişli, müzikli video editörü.
            Aşağıdaki **KlipStudyo.apk** dosyasını indirip telefona kur.
          files: KlipStudyo.apk
